name: Build check (no live deploy)

# Do not auto-deploy on push. GitHub-hosted runners cannot reach 192.168.1.20,
# and uploading Vite dist/ would overwrite the live Optima HTML on optima-web :8088.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Vite project
        run: npm run build
        env:
          VITE_APP_NAME: Website OptimaDigitalSelaras

      - name: Reminder
        run: |
          echo "Build only. Live Optima is Docker optima-web on GIOS :8088."
          echo "Do not SCP dist/ onto the NAS live origin."
