<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>404 — Halaman tidak ditemukan | Optima Digital Selaras</title>
  <style>
    :root {
      --bg: #0f1720;
      --fg: #e8eef4;
      --muted: #9aa8b5;
      --accent: #2f6fed;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Segoe UI", system-ui, sans-serif;
      background:
        radial-gradient(1200px 600px at 10% -10%, #1b3a5c 0%, transparent 55%),
        radial-gradient(900px 500px at 110% 10%, #143028 0%, transparent 50%),
        var(--bg);
      color: var(--fg);
      padding: 2rem;
    }
    main { max-width: 34rem; text-align: center; }
    p.brand {
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-size: 0.75rem;
      color: var(--muted);
      margin: 0 0 1rem;
    }
    h1 { font-size: clamp(2rem, 5vw, 3rem); margin: 0 0 0.75rem; font-weight: 650; }
    p.lead { color: var(--muted); line-height: 1.55; margin: 0 0 1.75rem; }
    a {
      display: inline-block;
      padding: 0.7rem 1.2rem;
      border-radius: 0.5rem;
      background: var(--accent);
      color: #fff;
      text-decoration: none;
      font-weight: 600;
    }
    a:hover { filter: brightness(1.08); }
  </style>
</head>
<body>
  <main>
    <p class="brand">PT Optima Digital Selaras</p>
    <h1>404 — Halaman tidak ditemukan</h1>
    <p class="lead">URL yang Anda buka tidak ada atau sudah dipindahkan. Silakan kembali ke beranda.</p>
    <a href="/">Kembali ke beranda</a>
  </main>
</body>
</html>
