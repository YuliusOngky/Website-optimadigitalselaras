<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 155 40" width="155" height="40">
  <!-- House icon -->
  <g fill="#2563EB">
    <!-- Roof -->
    <polygon points="4,20 20,6 36,20" />
    <!-- Door/body -->
    <rect x="8" y="18" width="24" height="16" rx="1"/>
    <!-- Door cutout white -->
    <rect x="14" y="26" width="12" height="8" rx="1" fill="white"/>
    <!-- Chimney -->
    <rect x="26" y="9" width="4" height="7" rx="1"/>
  </g>
  <!-- Brand text -->
  <text x="44" y="27" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="700" fill="#1e293b" letter-spacing="-0.5">Home</text>
  <text x="94" y="27" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="400" fill="#2563EB" letter-spacing="-0.5">list</text>
</svg>
