# --- paste inside http { } if not already present (nginx.conf main) ---
# server_tokens off;

# --- paste inside the apex server { } for optimadigitalselaras ---
server_tokens off;

error_page 404 /404.html;
location = /404.html {
    internal;
    root /usr/share/nginx/html;
}

# Also hide version on common gateway errors:
error_page 500 502 503 504 /404.html;
